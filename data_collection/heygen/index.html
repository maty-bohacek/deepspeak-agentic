<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.0.0/dist/livekit-client.umd.min.js"></script>
  </head>
  <body>
    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const LIVEKIT_URL = urlParams.get('livekit_url');
      const LIVEKIT_TOKEN = urlParams.get('livekit_token');
      const SESSION_ID = urlParams.get('session_id') || 'unknown';
      const COMBO_ID = urlParams.get('combo_id') || '';
      
      let mediaRecorder = null;
      let recordedChunks = [];
      let lastBackupIndex = 0;
      let isRecording = false;
      let recordingFilename = null;
      let remoteAudioElements = [];
      let hasRemoteVideo = false;
      let hasRemoteAudio = false;
      let isEnding = false;
      let backupInterval = null;
      let backupInProgress = false;
      
      const LivekitClient = window.LivekitClient || window.livekit;
      let room = null;
      
      async function connectAndRecord() {
        if (!LIVEKIT_URL || !LIVEKIT_TOKEN) {
          document.body.innerHTML = '<h2 style="color: red; font-family: sans-serif; padding: 20px;">error: missing session parameters</h2>';
          return;
        }
        
        try {
          room = new LivekitClient.Room({ adaptiveStream: true, dynacast: true });
          
          room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
            if (track.kind === LivekitClient.Track.Kind.Video) {
              const remoteVideo = document.getElementById('remote-video');
              track.attach(remoteVideo);
              hasRemoteVideo = true;
              tryStartRecording();
            } else if (track.kind === LivekitClient.Track.Kind.Audio) {
              const audioEl = track.attach();
              audioEl.style.display = 'none';
              document.body.appendChild(audioEl);
              remoteAudioElements.push(audioEl);
              hasRemoteAudio = true;
              tryStartRecording();
            }
          });
          
          room.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track) => {
            track.detach();
          });
          
          room.on(LivekitClient.RoomEvent.Disconnected, () => {
            if (isRecording && !isEnding) {
              endCall();
            }
          });
          
          await room.connect(LIVEKIT_URL, LIVEKIT_TOKEN);
          await room.localParticipant.enableCameraAndMicrophone();
          
          const localVideo = room.localParticipant.getTrackPublication(LivekitClient.Track.Source.Camera);
          if (localVideo && localVideo.track) {
            localVideo.track.attach(document.getElementById('local-video'));
          }
          
          document.getElementById('hangup-container').style.display = 'flex';
          
        } catch (error) {
          console.error('failed to connect:', error);
        }
      }
      
      function tryStartRecording() {
        if (hasRemoteVideo && hasRemoteAudio && !isRecording) {
          startRecording();
        }
      }
      
      async function startRecording() {
        if (isRecording) return;
        
        try {
          const remoteVideo = document.getElementById('remote-video');
          const localVideo = document.getElementById('local-video');
          
          const canvas = document.createElement('canvas');
          canvas.width = 1920;
          canvas.height = 720;
          const ctx = canvas.getContext('2d');
          
          const userAudioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          
          const audioContext = new AudioContext();
          if (audioContext.state === 'suspended') {
            await audioContext.resume();
          }
          
          const destination = audioContext.createMediaStreamDestination();
          
          const userAudioSource = audioContext.createMediaStreamSource(userAudioStream);
          const userGain = audioContext.createGain();
          userGain.gain.value = 1.0;
          userAudioSource.connect(userGain);
          userGain.connect(destination);
          
          for (let i = 0; i < remoteAudioElements.length; i++) {
            const audioEl = remoteAudioElements[i];
            if (audioEl && audioEl.srcObject) {
              const remoteStream = audioEl.srcObject;
              const remoteAudioTracks = remoteStream.getAudioTracks();
              if (remoteAudioTracks.length > 0) {
                const remoteAudioSource = audioContext.createMediaStreamSource(remoteStream);
                const remoteGain = audioContext.createGain();
                remoteGain.gain.value = 3.0;
                remoteAudioSource.connect(remoteGain);
                remoteGain.connect(destination);
              }
            }
          }
          
          const canvasStream = canvas.captureStream(30);
          const combinedStream = new MediaStream([
            ...canvasStream.getVideoTracks(),
            ...destination.stream.getAudioTracks()
          ]);
          
          function drawFit(video, slotX, slotW, slotH) {
            const vw = video.videoWidth || slotW;
            const vh = video.videoHeight || slotH;
            const scale = Math.min(slotW / vw, slotH / vh);
            const dw = vw * scale;
            const dh = vh * scale;
            const dx = slotX + (slotW - dw) / 2;
            const dy = (slotH - dh) / 2;
            ctx.drawImage(video, dx, dy, dw, dh);
          }

          function drawFrame() {
            if (isRecording) {
              ctx.fillStyle = '#000';
              ctx.fillRect(0, 0, canvas.width, canvas.height);
              const halfWidth = canvas.width / 2;
              drawFit(remoteVideo, 0, halfWidth, canvas.height);
              if (localVideo.srcObject) {
                drawFit(localVideo, halfWidth, halfWidth, canvas.height);
              }
              ctx.strokeStyle = '#333';
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.moveTo(halfWidth, 0);
              ctx.lineTo(halfWidth, canvas.height);
              ctx.stroke();
              requestAnimationFrame(drawFrame);
            }
          }
          
          mediaRecorder = new MediaRecorder(combinedStream);
          recordedChunks = [];
          lastBackupIndex = 0;
          recordingFilename = `liveavatar_${SESSION_ID}_${new Date().toISOString().replace(/[:.]/g, '-')}.webm`;
          
          mediaRecorder.ondataavailable = (event) => {
            if (event.data.size > 0) {
              recordedChunks.push(event.data);
            }
          };
          
          mediaRecorder.onstop = async () => {
            if (backupInterval) {
              clearInterval(backupInterval);
              backupInterval = null;
            }
            const success = await uploadFinalRecording();
            if (isEnding) {
              showEndScreen(success);
            }
          };
          
          mediaRecorder.start();
          isRecording = true;
          drawFrame();
          
          backupInterval = setInterval(() => {
            if (isRecording && mediaRecorder.state === 'recording' && !backupInProgress) {
              mediaRecorder.requestData();
              setTimeout(() => {
                if (recordedChunks.length > lastBackupIndex) {
                  uploadBackup();
                }
              }, 500);
            }
          }, 30000);
          
        } catch (error) {
          console.error('failed to start recording:', error);
        }
      }
      
      async function endCall() {
        if (isEnding) return;
        isEnding = true;
        
        const hangupBtn = document.getElementById('hangup-btn');
        hangupBtn.disabled = true;
        hangupBtn.innerHTML = '<span class="spinner"></span> Saving...';
        
        if (mediaRecorder && mediaRecorder.state === 'recording') {
          mediaRecorder.stop();
          isRecording = false;
        } else {
          showEndScreen();
        }
        
        if (room) {
          room.disconnect();
        }
      }
      
      function showEndScreen(success = true) {
        document.getElementById('call-container').style.display = 'none';
        document.getElementById('hangup-container').style.display = 'none';
        document.getElementById('end-screen').style.display = 'flex';
        
        if (!success) {
          document.querySelector('.end-title').textContent = 'Call Ended';
          document.querySelector('.end-subtitle').textContent = 'Recording saved to backup.';
        }
      }
      
      async function uploadBackup() {
        if (recordedChunks.length <= lastBackupIndex) return;
        
        backupInProgress = true;
        try {
          const newChunks = recordedChunks.slice(lastBackupIndex);
          const blob = new Blob(newChunks, { type: 'video/webm' });
          const formData = new FormData();
          const partNum = lastBackupIndex;
          formData.append('recording', blob, `backup_part${partNum}_${recordingFilename}`);
          formData.append('session_id', SESSION_ID);
          
          await fetch('/webhook/backup', { method: 'POST', body: formData });
          lastBackupIndex = recordedChunks.length;
        } catch (error) {
          console.error('backup failed:', error);
        } finally {
          backupInProgress = false;
        }
      }
      
      async function uploadFinalRecording() {
        if (recordedChunks.length === 0) return false;
        
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        
        try {
          const formData = new FormData();
          formData.append('recording', blob, recordingFilename);
          formData.append('session_id', SESSION_ID);
          formData.append('combo_id', COMBO_ID);
          formData.append('timestamp', new Date().toISOString());
          
          const response = await fetch('/webhook/recording', { method: 'POST', body: formData });
          return response.ok;
        } catch (error) {
          console.error('upload failed:', error);
          return false;
        }
      }
      
      window.addEventListener('beforeunload', (event) => {
        if (isRecording && !isEnding) {
          if (mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.requestData();
          }
          isRecording = false;
        }
        if (room) {
          room.disconnect();
        }
      });
      
      window.addEventListener('load', connectAndRecord);
    </script>
    
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #000;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      
      #call-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      
      #remote-video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      
      #local-video {
        position: fixed;
        bottom: 100px;
        right: 20px;
        width: 180px;
        height: 135px;
        border-radius: 12px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        object-fit: cover;
        z-index: 10;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      }
      
      #hangup-container {
        display: none;
        position: fixed;
        bottom: 30px;
        left: 0;
        right: 0;
        justify-content: center;
        z-index: 20;
      }
      
      #hangup-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 16px 32px;
        background: #ef4444;
        color: white;
        border: none;
        border-radius: 50px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4);
        transition: all 0.2s ease;
        min-width: 160px;
      }
      
      #hangup-btn:hover:not(:disabled) {
        background: #dc2626;
        transform: scale(1.05);
      }
      
      #hangup-btn:disabled {
        background: #888;
        cursor: not-allowed;
      }
      
      .spinner {
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      #end-screen {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        text-align: center;
      }
      
      .end-icon {
        font-size: 80px;
        margin-bottom: 24px;
      }
      
      .end-title {
        font-size: 32px;
        font-weight: 600;
        margin-bottom: 12px;
      }
      
      .end-subtitle {
        font-size: 18px;
        color: rgba(255, 255, 255, 0.7);
        margin-bottom: 40px;
      }
      
      .end-info {
        background: rgba(255, 255, 255, 0.1);
        padding: 16px 24px;
        border-radius: 12px;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.8);
      }
    </style>
    
    <div id="call-container">
      <video id="remote-video" autoplay playsinline></video>
      <video id="local-video" autoplay playsinline muted></video>
    </div>
    
    <div id="hangup-container">
      <button id="hangup-btn" onclick="endCall()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" transform="rotate(135 12 12)"/>
        </svg>
        End Call
      </button>
    </div>
    
    <div id="end-screen">
      <div class="end-icon">&#10003;</div>
      <div class="end-title">Call Concluded</div>
      <div class="end-subtitle">Your recording has been saved successfully</div>
      <div class="end-info">
        Session ID: <strong id="end-session-id"></strong>
      </div>
    </div>
    
    <script>
      document.getElementById('end-session-id').textContent = SESSION_ID;
    </script>
  </body>
</html>
