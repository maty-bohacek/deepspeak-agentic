# Non-secret settings. API keys are read from the environment only — export before running:
#   HEYGEN_API_KEY, TAVUS_API_KEY, ELEVENLABS_API_KEY (see data_collection/README.md).

PUBLIC_DOMAIN: "INSERT_YOUR_PUBLIC_DOMAIN_HERE"

# HeyGen recording uploads (S3). Region used in public object URL hints in orchestration output.
HEYGEN_S3_BUCKET: "heygen-v3-data-storage"
HEYGEN_S3_PREFIX: "heygen/"
HEYGEN_S3_REGION: "us-east-1"

# Tavus recording (S3) — used by Tavus web server / API paths
TAVUS_S3_BUCKET: ""
TAVUS_S3_REGION: "us-east-1"
TAVUS_AWS_ASSUME_ROLE_ARN: ""

# Which provider this workspace uses: seeds output/1_combinations/agent_config.json from
# assets/agent_config_heygen.json or assets/agent_config_tavus.json. Must match the
# orchestration tree you run (`heygen/orchestration/` vs `tavus/orchestration/`).
COLLECTION_PLATFORM: heygen

# Qualtrics QSF: the block list (Element "BL") contains blocks; one block is the URL
# template that gets duplicated per combo. Set this to that block's "ID" (e.g. BL_abc123)
# from your exported .qsf JSON. See assets/EXAMPLE_qualtrics_template/README.md.
QUALTRICS_TEMPLATE_BLOCK_ID: "PLACEHOLDER_QUALTRICS_TEMPLATE_BLOCK_ID"

# Pipeline
RANDOM_SEED: 24
N_COMBOS: 6
